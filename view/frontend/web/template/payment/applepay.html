<style>
    .discount-code {
        float: left;
        clear: both;
    }

    .tuna-wallet-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 8px 0 12px;
    }

    .tuna-wallet-header img {
        max-height: 24px;
    }

    .tuna-wallet-state {
        display: block;
        margin-top: 8px;
        color: #4a4a4a;
    }
</style>
<!-- ko if: isActive() -->
<div class="payment-method" style="overflow: auto;"
    data-bind="css: {'_active': (getCode() == isChecked())}, afterRender: afterRender">
    <div class="payment-method-title field choice">
        <input type="radio" name="payment[method]" class="radio" data-bind="attr: {'id': getCode()}, value: getCode(),
                checked: isChecked,
                click: selectPaymentMethod,
                visible: isRadioButtonVisible()" />
        <label data-bind="attr: {'for': getCode()}" class="label lbl-billing-address">
            <span id="applePayTitle"></span>
        </label>
    </div>

    <div class="payment-method-content" id="tuna_payment_method_content">
        <span id="control"></span>
        <label data-bind="attr: {for: 'addressContainer'}" class="label lbl-billing-address">
            <span>
                <!-- ko i18n: 'Endereco da compra' -->
                <!-- /ko -->
            </span>
        </label>
        <div class="payment-method-billing-address">
            <!-- ko foreach: $parent.getRegion(getBillingAddressFormName()) -->
            <!-- ko template: getTemplate() -->
            <!-- /ko -->
            <!--/ko-->
        </div>

        <div class="tuna-wallet-header">
            <img data-bind="attr: { src: getApplePayLogo() }" alt="Apple Pay" />
            <strong><!-- ko i18n: 'Pague com Apple Pay' --><!-- /ko --></strong>
        </div>

        <div id="applePayButtonContainer"></div>
        <small id="applePayState" class="tuna-wallet-state"><!-- ko i18n: 'Clique no botao do Apple Pay para autenticar sua carteira.' --><!-- /ko --></small>

        <!-- O pagamento da carteira digital e concluido pelo botao nativo do Apple Pay -->
    </div>
</div>
<!--/ko-->
